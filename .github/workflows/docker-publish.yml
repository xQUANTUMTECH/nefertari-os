name: publish-agentd-image

# Builds the Nefertari agentd image and publishes it PUBLICLY to GitHub Container
# Registry (ghcr.io/<owner>/nefertari-agentd). Anyone can then:
#   docker pull ghcr.io/xquantumtech/nefertari-agentd:latest
# No secrets needed — GITHUB_TOKEN is provided by Actions. Make the package
# public once: GitHub > Packages > nefertari-agentd > Package settings > Change
# visibility > Public (first publish creates it private by default).

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "packages/agentd/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nefertari-agentd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/agentd
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
